<main class="container page">
  <header class="page-header">
    <div class="row-between">
      <div>
        <h1 data-route-heading tabindex="-1">Dettaglio lega</h1>
        <p>Gestisci classifica, inviti e asta della lega.</p>
      </div>

      <!-- TODO: mostrare questo link solo all'admin della lega.
        Domanda guida: da dove recuperi un flag admin affidabile per questa lega?
        Hint: il dashboard riceve gia un campo admin per ogni lega; valuta se il backend
        deve esporre anche un endpoint di dettaglio lega con admin/current user permissions. -->
      <a class="btn btn--primary" [routerLink]="['/leagues', leagueId, 'auction']">
        Gestisci asta
      </a>
    </div>
  </header>

  <section aria-labelledby="standings-title">
    <h2 id="standings-title">Classifica</h2>
    <app-standings [leagueId]="leagueId" />
  </section>

  <section aria-labelledby="invite-title">
    <h2 id="invite-title">Inviti</h2>
    <app-invite-league [leagueId]="leagueId" />
  </section>
</main>
