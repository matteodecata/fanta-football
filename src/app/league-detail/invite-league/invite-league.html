<form novalidate (submit)="onSubmit($event)">
  <h2>Invita un utente</h2>

  <label for="invite-user">Username</label>
  <input
    id="invite-user"
    type="text"
    [formField]="inviteForm.username"
    [attr.aria-invalid]="inviteForm.username().touched() && inviteForm.username().invalid() ? 'true' : null"
    [attr.aria-describedby]="inviteForm.username().touched() && inviteForm.username().invalid() ? 'invite-user-error' : null"
  />

  @if (inviteForm.username().touched() && inviteForm.username().invalid()) {
    <ul id="invite-user-error" class="error-list" role="alert">
      @for (error of inviteForm.username().errors(); track error.kind) {
        <li>{{ error.message }}</li>
      }
    </ul>
  }

  <button type="submit">Invita</button>
</form>
