<form class="form" novalidate (submit)="onSubmit($event)">
  @if (submitError()) {
    <p class="alert alert--danger" role="alert" aria-live="assertive">{{ submitError() }}</p>
  }

  @if (submitSuccess()) {
    <p class="alert alert--success" role="status" aria-live="polite">{{ submitSuccess() }}</p>
  }

  <div class="field">
    <label class="field__label" for="team-name">Nuovo nome squadra</label>
    <input
      id="team-name"
      class="input"
      type="text"
      [formField]="renameForm.name"
      [attr.aria-describedby]="renameForm.name().touched() && renameForm.name().invalid() ? 'team-name-error' : null"
      [attr.aria-invalid]="renameForm.name().touched() && renameForm.name().invalid() ? 'true' : null"
    />

    @if (renameForm.name().touched() && renameForm.name().invalid()) {
      <ul id="team-name-error" class="field__error" role="alert">
        @for (error of renameForm.name().errors(); track error) {
          <li>{{ error.message }}</li>
        }
      </ul>
    }
  </div>

  <button class="btn btn--primary" type="submit" [disabled]="isSubmitting()">
    {{ isSubmitting() ? 'Salvataggio...' : 'Salva nome' }}
  </button>
</form>
