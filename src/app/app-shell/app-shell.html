<header class="app-header">
  <div class="app-header__inner">
    <a class="brand" routerLink="/dashboard">
      <span class="brand__mark" aria-hidden="true">FF</span>
      FantaFootball
    </a>

    <nav class="nav" aria-label="Principale">
      <a class="nav-link" routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page">Dashboard</a>
      <a class="nav-link" routerLink="/teams" routerLinkActive="is-active" ariaCurrentWhenActive="page">Squadre</a>
      <a class="nav-link" routerLink="/players" routerLinkActive="is-active" ariaCurrentWhenActive="page">Calciatori</a>
      <!-- TODO: sostituire con la rotta dedicata alla lista scambi, quando esisterà -->
      <a class="nav-link" routerLink="/trades" routerLinkActive="is-active" ariaCurrentWhenActive="page">Scambi</a>
    </nav>

    <nav class="nav ml-auto" aria-label="Account">
      <a class="nav-link" routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page">Inviti</a>
      <div class="account-menu" #accountMenu>
        <button #accountTrigger class="nav-link account-link" type="button"
          [attr.aria-expanded]="accountMenuOpen()" aria-controls="account-actions"
          [attr.aria-label]="'Menu account di ' + (session.username() || 'utente')"
          (click)="accountMenuOpen.set(!accountMenuOpen())">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
          </svg>
          <span class="account-name">{{ session.username() || 'Profilo' }}</span>
        </button>
        <div id="account-actions" class="account-actions" [hidden]="!accountMenuOpen()">
          <a routerLink="/account" (click)="closeAccountMenu(true)">Impostazioni account</a>
          <button type="button" (click)="logout()">Logout</button>
        </div>
      </div>
    </nav>
  </div>
</header>
<main>
  <router-outlet (activate)="focusRouteHeading()"/>
</main>
