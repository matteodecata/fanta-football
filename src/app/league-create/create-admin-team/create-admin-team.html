<div class="field">
  <label class="field__label" for="admin-team-name">Nome della tua squadra</label>
  <input
    id="admin-team-name"
    class="input"
    type="text"
    [formField]="teamNameField()"
    [attr.aria-describedby]="teamNameField()().touched() && teamNameField()().invalid() ? 'admin-team-name-error' : null"
    [attr.aria-invalid]="teamNameField()().touched() && teamNameField()().invalid() ? 'true' : null"
  />

  @if (teamNameField()().touched() && teamNameField()().invalid()) {
    <ul id="admin-team-name-error" class="field__error" role="alert">
      @for (error of teamNameField()().errors(); track error) {
        <li>{{ error.message }}</li>
      }
    </ul>
  }
</div>
