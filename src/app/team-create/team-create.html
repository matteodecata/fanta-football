<main class="page-shell">
  <section class="card" aria-labelledby="team-create-title">
    <h1 id="team-create-title" data-route-heading tabindex="-1">Crea la tua squadra</h1>

    <form class="form" novalidate (submit)="onSubmit($event)" [attr.aria-busy]="isSubmitting()">
      @if (submitError()) {
        <p class="alert alert--danger" role="alert" aria-live="assertive">{{ submitError() }}</p>
      }

      <div class="field">
        <label class="field__label" for="team-name">Inserisci il nome della tua nuova squadra</label>
        <input
          id="team-name"
          class="input"
          type="text"
          [formField]="teamForm.teamName"
          [attr.aria-describedby]="teamForm.teamName().touched() && teamForm.teamName().invalid() ? 'team-name-error' : null"
          [attr.aria-invalid]="teamForm.teamName().touched() && teamForm.teamName().invalid() ? 'true' : null"
        />

        @if (teamForm.teamName().touched() && teamForm.teamName().invalid()) {
          <ul id="team-name-error" class="field__error" role="alert">
            @for (error of teamForm.teamName().errors(); track error) {
              <li>{{ error.message }}</li>
            }
          </ul>
        }
      </div>

      <button class="btn btn--primary btn--block" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creazione in corso...' : 'Crea squadra' }}
      </button>
    </form>
  </section>
</main>
